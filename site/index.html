<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月之工作台</title>
<meta name="description" content="AI 使用时长与 token 统计，以及英语跟读练习。">
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f1; --panel: #fffffe; --ink: #1b1a17; --ink-2: #57554f; --ink-3: #8e8b83;
  --line: #e7e4dc; --line-2: #efede7; --accent: #b5562f; --hover: #f1efe9;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --cli: #2a78d6; --desktop: #eb6834; --web: #1baf7a; --ring-5h: #8f8a80; --trend: #3d3b36;
  --good: #1f7a4d; --warn: #b26b00; --bad: #c0392b;
  --shadow: 0 1px 2px rgb(40 30 10 / 4%), 0 8px 24px rgb(40 30 10 / 5%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --panel: #1b1b19; --ink: #efede8; --ink-2: #b9b6ad; --ink-3: #85827a;
    --line: #2c2b28; --line-2: #242321; --accent: #e07a4f; --hover: #23221f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --cli: #3987e5; --desktop: #d95926; --web: #199e70; --ring-5h: #aaa59b; --trend: #d8d5cc;
    --good: #4cbb84; --warn: #e0a33a; --bad: #e66767; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --panel: #1b1b19; --ink: #efede8; --ink-2: #b9b6ad; --ink-3: #85827a;
  --line: #2c2b28; --line-2: #242321; --accent: #e07a4f; --hover: #23221f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --cli: #3987e5; --desktop: #d95926; --web: #199e70; --ring-5h: #aaa59b; --trend: #d8d5cc;
  --good: #4cbb84; --warn: #e0a33a; --bad: #e66767; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.serif { font-family: "New York", "Iowan Old Style", Georgia, "Songti SC", serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 48px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
header.top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
header.top .meta { color: var(--ink-3); font-size: 13px; display: flex; gap: 14px; align-items: center; }
.theme { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.theme:hover { color: var(--ink); background: var(--hover); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px 24px 24px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
.panel-head h2 span { color: var(--ink-3); font-weight: 400; margin-left: 6px; font-size: 13px; }
.sub { color: var(--ink-3); font-size: 12px; }
.section-title { color: var(--ink-3); font-size: 12px; letter-spacing: 0.06em; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--line-2); border-radius: 9px; padding: 2px; max-width: 100%; min-width: 0; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 4px 11px; min-width: 0; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 8%); }

/* AI 用量 */
.usage .panel-head { margin-bottom: 20px; }
.head-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.update { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.update.stale { color: var(--warn); }

.hero { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
.hero > div { padding: 18px 0 18px 22px; min-width: 0; }
.hero > div:first-child { padding-left: 0; }
.hero > div + div { border-left: 1px solid var(--line-2); }
.hero .k { color: var(--ink-3); font-size: 12px; letter-spacing: 0.04em; }
.hero .v { font-size: 34px; font-weight: 600; line-height: 1.1; margin-top: 6px; letter-spacing: -0.02em; }
.hero .v small { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 1px; }
.quota { display: flex; align-items: center; gap: 14px; }
.quota svg { width: 46px; height: 46px; flex: none; transform: rotate(-90deg); }
.quota circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.quota .track { stroke: var(--line-2); }
.quota .arc { stroke: var(--ring-5h); transition: stroke-dashoffset 700ms ease; }
.quota .arc.warn { stroke: var(--warn); }
.quota .arc.bad { stroke: var(--bad); }
.quota .v { margin-top: 0; font-size: 26px; }
.quota .k { margin-bottom: 2px; }
.quota .qsub { color: var(--ink-3); font-size: 10.5px; margin-top: 2px; white-space: nowrap; }

.ends { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; padding: 22px 0 6px; }
.end { min-width: 0; }
.end-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.end-head i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.end-head span { margin-left: auto; color: var(--ink-3); font-weight: 400; font-size: 11.5px; }
.end-main { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
.end-main b { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.end-main em { font-style: normal; color: var(--ink-2); font-size: 13px; }
.share { height: 3px; border-radius: 2px; background: var(--line-2); margin: 10px 0 9px; overflow: hidden; }
.share i { display: block; height: 100%; border-radius: 2px; transition: width 600ms ease; }
.end-sub { display: grid; gap: 3px; color: var(--ink-3); font-size: 12px; }
.end-sub div { display: flex; justify-content: space-between; gap: 8px; }
.end-sub div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.chart-head { display: flex; align-items: center; gap: 16px; margin: 24px 0 6px; flex-wrap: wrap; }
.chart-head h3 { margin: 0 auto 0 0; font-size: 13px; font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.legend i.line { width: 14px; height: 2px; border-radius: 1px; background: var(--trend); }
.seg.small button { padding: 3px 10px; font-size: 12px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 210px; overflow: visible; }
.chart .axis { fill: var(--ink-3); font-size: 10.5px; }
.chart .grid-line { stroke: var(--line-2); stroke-width: 1; }
.chart .trend { fill: none; stroke: var(--trend); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .cursor { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / 10%); min-width: 180px; opacity: 0; transition: opacity 120ms; z-index: 5; }
.tip.on { opacity: 1; }
.tip .tt { color: var(--ink-3); margin-bottom: 5px; }
.tip .tr { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: center; line-height: 1.6; }
.tip .tr i { width: 8px; height: 8px; border-radius: 2px; }
.tip .tr i.line { width: 12px; height: 2px; background: var(--trend); }
.tip .tr.sum { border-top: 1px solid var(--line-2); margin-top: 3px; padding-top: 3px; font-weight: 600; }
details.data { margin-top: 8px; font-size: 12px; color: var(--ink-3); }
details.data summary { cursor: pointer; width: max-content; }
details.data .scroll { max-height: 260px; overflow: auto; }
details.data table { width: 100%; border-collapse: collapse; margin-top: 8px; color: var(--ink-2); }
details.data th, details.data td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--line-2); font-weight: 400; white-space: nowrap; }
details.data th:first-child, details.data td:first-child { text-align: left; }
.foot { margin-top: 14px; color: var(--ink-3); font-size: 11.5px; line-height: 1.6; }

/* 英语区：宽屏左跟读、右生词 */
.en-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.en-side > .section-title:first-child { margin-top: 0; }
@media (max-width: 980px) {
  .en-grid { grid-template-columns: 1fr; gap: 0; }
  .en-side > .section-title:first-child { margin-top: 22px; }
}

/* 英语：跟读 */
.chips { display: flex; gap: 16px; color: var(--ink-2); font-size: 12.5px; flex-wrap: wrap; }
.chips b { color: var(--ink); font-weight: 600; margin-right: 2px; }
.progress { height: 3px; background: var(--line-2); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width 400ms ease; }
.topics { margin-bottom: 14px; }
.read { border: 1px solid var(--line-2); border-radius: 14px; padding: 18px 20px 16px; }
.read .pos { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 12px; }
.sentence { font-size: 23px; line-height: 1.5; margin: 14px 0 6px; word-break: break-word; }
.sentence .w { border-radius: 4px; padding: 0 1px; transition: background 200ms, color 200ms; }
.sentence .w.hit { color: var(--good); }
.sentence .w.miss { color: var(--bad); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.sentence .w.now { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.zh { color: var(--ink-2); font-size: 14px; min-height: 21px; }
.zh button { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 0; font-size: 12.5px; }
.zh button:hover { color: var(--ink); }
.controls { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin-top: 16px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background 120ms, border-color 120ms; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn kbd { font: 10.5px ui-monospace, monospace; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.primary kbd { color: inherit; border-color: color-mix(in srgb, var(--panel) 40%, transparent); }
.btn.primary:hover { opacity: 0.9; background: var(--ink); }
.btn.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.rec kbd { color: inherit; border-color: rgb(255 255 255 / 45%); }
.subcontrols { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.link { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 3px 6px; border-radius: 6px; font-size: 12.5px; }
.link:hover { color: var(--ink); background: var(--hover); }
.link[aria-pressed="true"] { color: var(--ink); }
.result { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); display: none; gap: 4px; }
.result.on { display: grid; }
.result .score { display: flex; align-items: baseline; gap: 10px; }
.result .score b { font-size: 26px; font-weight: 600; }
.result .score span { color: var(--ink-3); font-size: 12.5px; }
.result .heard { color: var(--ink-2); font-size: 13px; }
.nav { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; margin-top: 14px; align-items: center; }
.nav .dots { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.nav .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.nav .dots i.done { background: var(--good); }
.nav .dots i.cur { outline: 1.5px solid var(--ink-3); outline-offset: 1px; }
.note { color: var(--ink-3); font-size: 12px; margin-top: 10px; }
.custom { display: grid; gap: 8px; margin-top: 10px; }
.field { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 8px 10px; width: 100%; outline: none; }
.field:focus { border-color: var(--ink-3); background: var(--panel); }
textarea.field { min-height: 84px; resize: vertical; line-height: 1.5; }
.row-end { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn-sm { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.btn-sm:hover { background: var(--hover); }
.msg { font-size: 12px; color: var(--ink-3); }
.msg.err { color: var(--bad); }

/* 英语：生词（辅助） */
.vocab { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; }
.vocab .vf { font-size: 18px; font-weight: 500; }
.vocab .vb { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.vocab .ve { color: var(--ink-3); font-size: 12.5px; font-style: italic; margin-top: 2px; }
.vocab .va { display: flex; gap: 6px; }
.vocab .va .btn { padding: 6px 10px; font-size: 13px; }
.vocab .va .again { color: var(--bad); }
.vocab .va .good { color: var(--good); }
details.more { margin-top: 10px; }
details.more summary { cursor: pointer; color: var(--ink-3); font-size: 12px; width: max-content; }
.deck-list { margin-top: 8px; max-height: 240px; overflow: auto; border-top: 1px solid var(--line-2); }
.deck-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.deck-item .f { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-item .f span { color: var(--ink-3); margin-left: 8px; }
.deck-item .b { color: var(--ink-3); font-size: 11.5px; }
.deck-item button { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.deck-item button:hover { color: var(--bad); background: var(--hover); }
form.add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 10px; }
form.add .ex { grid-column: 1 / 3; }

@media (max-width: 560px) {
  html, body { max-width: 100%; overflow-x: hidden; }
  .wrap { padding: 16px 12px 32px; }
  .panel { padding: 18px 16px 20px; }
  .panel-head { align-items: flex-start; }
  .seg { overflow: visible; width: 100%; }
  .seg button { flex: 1; padding: 5px 3px; font-size: 12px; }
  .hero { grid-template-columns: 1fr 1fr; }
  .hero > div { padding: 14px 0 14px 14px; }
  .hero > div:nth-child(odd) { padding-left: 0; border-left: 0; }
  .hero > div:nth-child(n+3) { border-top: 1px solid var(--line-2); }
  .hero .v { font-size: 26px; }
  .quota { gap: 10px; }
  .quota svg { width: 36px; height: 36px; }
  .quota .v { font-size: 22px; }
  .ends { grid-template-columns: 1fr; gap: 18px; }
  .chart svg { height: 170px; }
  .head-right { width: 100%; justify-content: space-between; }
  .sentence { font-size: 20px; }
  .controls { grid-template-columns: 1fr 1fr; }
  .controls .btn.primary { grid-column: 1 / -1; }
  form.add { grid-template-columns: 1fr; }
  form.add .ex { grid-column: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>月之工作台</h1>
    <div class="meta">
      <span id="today"></span>
      <button class="theme" id="theme" title="切换深浅色" aria-label="切换深浅色">◐</button>
    </div>
  </header>

  <div class="grid">
    <!-- ==================== AI 用量 ==================== -->
    <section class="panel usage" aria-labelledby="ai-h">
      <div class="panel-head">
        <h2 id="ai-h">AI 用量</h2>
        <div class="head-right">
          <span class="update" id="update-status">正在读取…</span>
          <div class="seg" id="period" role="group" aria-label="统计区间"></div>
        </div>
      </div>

      <div class="hero">
        <div><div class="k" id="k-time">使用时长</div><div class="v num" id="h-time">—</div></div>
        <div><div class="k" id="k-tok">Token</div><div class="v num" id="h-tok">—</div></div>
        <div class="quota" id="q-claude"></div>
        <div class="quota" id="q-codex"></div>
      </div>

      <div class="ends" id="ends"></div>

      <div class="chart-head">
        <h3>每日用量 · 近 30 天</h3>
        <div class="legend" id="legend"></div>
        <div class="seg small" id="metric" role="group" aria-label="指标"></div>
      </div>
      <div class="chart" id="chart"><svg id="svg" role="img" aria-label="近 30 天每日用量，按网页、终端、桌面堆叠，附 7 日均线"></svg><div class="tip" id="tip"></div></div>
      <details class="data"><summary>查看每日数据</summary><div class="scroll"><table id="table"></table></div></details>
      <div class="foot" id="foot"></div>
    </section>

    <!-- ==================== 英语 ==================== -->
    <section class="panel" aria-labelledby="en-h">
      <div class="panel-head">
        <h2 id="en-h">英语<span>跟读</span></h2>
        <div class="chips" id="chips"></div>
      </div>
      <div class="en-grid"><div class="en-main">
      <div class="progress"><i id="prog" style="width:0"></i></div>
      <div class="seg topics" id="topics" role="group" aria-label="材料"></div>

      <div class="read" id="read">
        <div class="pos"><span id="pos"></span><span id="passage-title"></span></div>
        <div class="sentence serif" id="sentence" aria-live="polite"></div>
        <div class="zh" id="zh"></div>
        <div class="controls">
          <button class="btn" id="b-listen" type="button">▶ 听 <kbd>空格</kbd></button>
          <button class="btn" id="b-play" type="button" disabled>回放录音</button>
          <button class="btn primary" id="b-rec" type="button">● 跟读 <kbd>R</kbd></button>
        </div>
        <div class="subcontrols">
          <span><button class="link" id="b-slow" type="button" aria-pressed="false">慢速</button><button class="link" id="b-zh" type="button" aria-pressed="false">显示中文</button></span>
          <span class="msg" id="rec-msg"></span>
        </div>
        <div class="result" id="result">
          <div class="score"><b class="num" id="score"></b><span id="score-d"></span></div>
          <div class="heard" id="heard"></div>
        </div>
        <div class="nav">
          <button class="btn" id="b-prev" type="button" aria-label="上一句">←</button>
          <div class="dots" id="dots"></div>
          <button class="btn" id="b-next" type="button">下一句 →</button>
        </div>
      </div>
      <div class="note" id="sr-note"></div>

      <details class="more" id="custom-box"><summary>用自己的文本练习（邮件、演讲稿……）</summary>
        <form class="custom" id="custom">
          <textarea class="field" name="text" placeholder="粘贴英文，按句子自动拆开"></textarea>
          <div class="row-end"><span class="msg" id="custom-msg">只保存在这个浏览器里</span><button class="btn-sm" type="submit">开始练习</button></div>
        </form>
      </details>

      </div><div class="en-side">
      <div class="section-title"><span>生词 · 辅助</span><span id="vocab-count"></span></div>
      <div id="vocab"></div>
      <details class="more"><summary>添加生词 / 词库</summary>
        <form class="add" id="add" autocomplete="off">
          <input class="field" name="front" placeholder="英文" required>
          <input class="field" name="back" placeholder="中文" required>
          <button class="btn-sm" type="submit">添加</button>
          <input class="field ex" name="example" placeholder="例句（可选）">
          <span class="msg" id="add-msg"></span>
        </form>
        <div class="deck-list" id="deck-list"></div>
      </details>
      </div></div>
    </section>
  </div>
</div>

<script>
(() => {
  // ================= 通用 =================
  const $ = id => document.getElementById(id)
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag)

    const raw = max / 4

  function drawChart() {
    const svg = $('svg')
    const W = svg.clientWidth || 640, H = svg.clientHeight || 210, padL = 40, padB = 22, padT = 8
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`)

    const totals = days.map(d => ENDS.reduce((s, e) => s + val(d[e.id]), 0))
    const isTime = metric === 'time'
    const max = Math.max(isTime ? 60 : 1000, ...totals, ...days.map(d => d.ma))
    const step = isTime ? niceStep(max, 30) : niceStep(max, 1)
    const top = Math.ceil(max / step) * step
    const y = v => padT + (H - padT - padB) * (1 - v / top)
    const tick = v => isTime ? (v >= 60 ? `${+(v / 60).toFixed(1)}h` : `${v}m`) : fmtTokStr(v)
    for (let v = 0; v <= top + 1e-9; v += step) {
      svg.append(svgEl('line', { x1: padL, x2: W, y1: y(v), y2: y(v), class: 'grid-line' }))
      const t = svgEl('text', { x: padL - 8, y: y(v) + 3.5, 'text-anchor': 'end', class: 'axis' }); t.textContent = tick(v); svg.append(t)
    }
    const bw = (W - padL) / days.length
    const barW = Math.max(3, Math.min(16, bw * 0.58))
    const cursor = svgEl('line', { class: 'cursor', y1: padT, y2: H - padB, x1: 0, x2: 0, opacity: 0 })
    days.forEach((d, i) => {
      const cx = padL + bw * i + bw / 2
      let acc = 0
      const parts = ENDS.filter(e => val(d[e.id]) > 0)
      parts.forEach((e, k) => {
        const v = val(d[e.id])
        const y0 = y(acc), y1 = y(acc + v)
        const h = Math.max(0, y0 - y1 - (k > 0 ? 2 : 0))
        acc += v
        if (h < 0.5) return
        // 只给最上面一段圆角，底部贴着基线
        const isTop = k === parts.length - 1
        const r = isTop ? Math.min(3, barW / 2, h) : 0
        svg.append(svgEl('path', { fill: css(e.color), d:
          `M${cx - barW / 2},${y1 + h} V${y1 + r} Q${cx - barW / 2},${y1} ${cx - barW / 2 + r},${y1} H${cx + barW / 2 - r} Q${cx + barW / 2},${y1} ${cx + barW / 2},${y1 + r} V${y1 + h} Z` }))
      })
      const every = days.length > 20 ? 5 : 2
      if ((days.length - 1 - i) % every === 0) {
        const t = svgEl('text', { x: cx, y: H - 6, 'text-anchor': 'middle', class: 'axis' })
        t.textContent = d.date.slice(5).replace('-', '/'); svg.append(t)
      }
    })
    const pts = days.map((d, i) => [padL + bw * i + bw / 2, y(d.ma)])

    svg.append(cursor)
    days.forEach((d, i) => {
      const cx = padL + bw * i + bw / 2
      const hit = svgEl('rect', { x: padL + bw * i, y: 0, width: bw, height: H - padB, fill: 'transparent' })
      hit.addEventListener('mouseenter', () => { cursor.setAttribute('x1', cx); cursor.setAttribute('x2', cx); cursor.setAttribute('opacity', 1); showTip(i, cx) })

    days = all.slice(6).map((d, i) => {

  const words = text => [...text.matchAll(/\S+/g)].map(m => ({ raw: m[0], at: m.index }))

  function score(target, heard) {
    // 目标词展开成小词，记住每个小词属于哪个原词
    const t = [], owner = []
    target.forEach((w, i) => { for (const p of expand(norm(w.raw))) if (p) { t.push(p); owner.push(i) } })
    const h = heard.split(/\s+/).map(norm).filter(Boolean).flatMap(expand)
    const n = t.length, m = h.length
    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0))
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i][j] = t[i] === h[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1])
    const hitPart = new Array(n).fill(false)
    for (let i = 0, j = 0; i < n && j < m;) {
      if (t[i] === h[j]) { hitPart[i] = true; i++; j++ } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++
    }
    const hit = target.map((_, i) => owner.every((o, k) => o !== i || hitPart[k]) && owner.includes(i))
    const counted = target.map((_, i) => owner.includes(i))
    const total = counted.filter(Boolean).length
    return { hit, pct: total ? Math.round(hit.filter((x, i) => x && counted[i]).length / total * 100) : 0 }
  }

  // 渲染
  function renderTopics() {
    $('topics').replaceChildren(...passages().map(p => el('button', { type: 'button', 'aria-pressed': String(p.id === topic),
      onclick: () => { topic = p.id; store.set('en-topic', topic); idx = firstUndone(); renderRead() } }, p.title)))
  }
  const doneKey = i => `${topic}:${i}`
  const firstUndone = () => {
    const done = todayLog().done
    const i = passage().lines.findIndex((_, k) => done[doneKey(k)] == null)
    return i < 0 ? 0 : i
  }
  function renderChips() {
    const log = todayLog()
    $('chips').replaceChildren(
      el('span', {}, el('b', { class: 'num' }, `${log.sentences}`), `/${GOAL} 句`),
      el('span', {}, el('b', { class: 'num' }, `${Math.round(log.seconds / 60)}`), '分钟'),
      el('span', {}, el('b', { class: 'num' }, `${streak()}`), '天连续'))
    $('prog').style.width = `${Math.min(100, log.sentences / GOAL * 100)}%`
  }
  function highlightAt(charIndex) {
    for (const s of $('sentence').querySelectorAll('.w')) {
      const at = +s.dataset.at
      s.classList.toggle('now', charIndex >= 0 && charIndex >= at && charIndex < at + s.textContent.length + 1)
    }
  }
  function renderRead(result) {
    for (const b of $('topics').children) b.setAttribute('aria-pressed', String(b.textContent === passage().title))
    const p = passage()
    if (idx >= p.lines.length) idx = 0
    const [en, zh] = p.lines[idx]
    const ws = words(en)
    $('pos').textContent = `${idx + 1} / ${p.lines.length}`
    $('passage-title').textContent = p.title
    $('sentence').replaceChildren(...ws.flatMap((w, i) => [
      el('span', { class: `w${result ? (result.hit[i] ? ' hit' : ' miss') : ''}`, 'data-at': w.at }, w.raw), ' ']))
    $('zh').replaceChildren(showZh ? (zh || '（没有中文）') : el('button', { type: 'button', onclick: () => { showZh = true; store.set('en-zh', true); renderRead(result); syncToggles() } }, '点这里看中文'))
    const done = todayLog().done
    $('dots').replaceChildren(...p.lines.map((_, k) => el('i', { class: `${done[`${topic}:${k}`] != null ? 'done' : ''}${k === idx ? ' cur' : ''}`, title: `第 ${k + 1} 句` })))
    $('b-prev').disabled = idx === 0
    $('b-next').textContent = idx === p.lines.length - 1 ? '换一组 →' : '下一句 →'
    if (!result) { $('result').classList.remove('on'); $('b-play').disabled = !lastAudio || lastAudioFor !== `${topic}:${idx}` }
  }
  function syncToggles() {
    $('b-slow').setAttribute('aria-pressed', String(slow)); $('b-slow').textContent = slow ? '慢速 ✓' : '慢速'
    $('b-zh').setAttribute('aria-pressed', String(showZh)); $('b-zh').textContent = showZh ? '隐藏中文' : '显示中文'
  }

  // 跟读：语音识别评分 + 录音回放
  let recognizing = false, rec = null, mediaRec = null, chunks = [], lastAudio = null, lastAudioFor = '', recStart = 0
  async function startRecording() {
    if (recognizing) return stopRecording()
    speechSynthesis?.cancel()
    const [en] = passage().lines[idx]
    const target = words(en)
    const key = `${topic}:${idx}`
    $('rec-msg').className = 'msg'; $('rec-msg').textContent = '请读出这句话…'
    recognizing = true; recStart = performance.now()
    $('b-rec').classList.add('rec'); $('b-rec').replaceChildren('■ 结束 ', el('kbd', {}, 'R'))
    // 录音（用于回放）
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
      chunks = []
      mediaRec = new MediaRecorder(stream)
      mediaRec.ondataavailable = e => chunks.push(e.data)
      mediaRec.onstop = () => {
        stream.getTracks().forEach(t => t.stop())
        if (lastAudio) URL.revokeObjectURL(lastAudio)
        lastAudio = URL.createObjectURL(new Blob(chunks, { type: mediaRec.mimeType || 'audio/webm' }))
        lastAudioFor = key
        $('b-play').disabled = false
      }
      mediaRec.start()
    } catch {
      mediaRec = null
      if (!SR) { $('rec-msg').className = 'msg err'; $('rec-msg').textContent = '无法使用麦克风：请在浏览器里允许麦克风权限'; return finishUi() }
    }
    if (!SR) return // 只录音，手动结束
    rec = new SR()
    rec.lang = 'en-US'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false
    let heard = ''
    rec.onresult = e => {
      heard = [...e.results].map(r => r[0].transcript).join(' ')
      $('rec-msg').textContent = heard
    }
    rec.onerror = e => {
      $('rec-msg').className = 'msg err'
      $('rec-msg').textContent = e.error === 'not-allowed' ? '请在浏览器里允许麦克风权限' : e.error === 'no-speech' ? '没听到声音，再试一次' : `识别出错：${e.error}`
    }
    rec.onend = () => {
      stopMedia()
      finishUi()
      if (!heard) return
      const res = score(target, heard)
      showResult(res, heard, key)
    }
    try { rec.start() } catch { finishUi() }
  }
  function stopMedia() { if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop() }
  function stopRecording() { if (rec) rec.stop(); else { stopMedia(); finishUi(); markDone(`${topic}:${idx}`, null); $('rec-msg').textContent = '已录音，点「回放录音」和原音对比' } }
  function finishUi() {
    if (recognizing) addSeconds((performance.now() - recStart) / 1000)
    recognizing = false; rec = null
    $('b-rec').classList.remove('rec'); $('b-rec').replaceChildren('● 跟读 ', el('kbd', {}, 'R'))
  }
  function markDone(key, pct) {
    const log = todayLog()
    if (log.done[key] == null) log.sentences++
    log.done[key] = Math.max(log.done[key] ?? -1, pct ?? 0)
    savePractice(); renderChips()
  }
  function showResult(res, heard, key) {
    markDone(key, res.pct)
    renderRead(res)
    $('result').classList.add('on')
    $('score').textContent = `${res.pct}%`
    const missed = words(passage().lines[idx][0]).filter((_, i) => !res.hit[i]).map(w => w.raw.replace(/[^\w'’-]/g, ''))
    $('score-d').textContent = res.pct >= 90 ? '很好，可以下一句' : res.pct >= 70 ? `再读一遍会更顺${missed.length ? `：注意 ${missed.slice(0, 4).join('、')}` : ''}`
      : `先点「听」跟着原音读几遍${missed.length ? `，红色的词没读清` : ''}`
    $('heard').textContent = `识别到：${heard}`
    $('rec-msg').textContent = ''
  }

  $('b-listen').addEventListener('click', () => speak(passage().lines[idx][0], highlightAt))
  $('b-rec').addEventListener('click', startRecording)
  $('b-play').addEventListener('click', () => { if (lastAudio) new Audio(lastAudio).play() })
  $('b-prev').addEventListener('click', () => { if (idx > 0) { idx--; renderRead() } })
  $('b-next').addEventListener('click', () => {
    const p = passage()
    if (idx < p.lines.length - 1) idx++
    else { const ps = passages(); topic = ps[(ps.findIndex(x => x.id === topic) + 1) % ps.length].id; store.set('en-topic', topic); idx = 0 }
    renderRead()
  })
  $('b-slow').addEventListener('click', () => { slow = !slow; store.set('en-slow', slow); syncToggles() })
  $('b-zh').addEventListener('click', () => { showZh = !showZh; store.set('en-zh', showZh); syncToggles(); renderRead() })
  addEventListener('keydown', e => {
    if ((e.target instanceof Element && e.target.closest('input, textarea, select, button, summary')) || e.metaKey || e.ctrlKey || e.altKey) return
    if (e.key === ' ') { e.preventDefault(); $('b-listen').click() }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startRecording() }
    else if (e.key === 'ArrowRight') $('b-next').click()
    else if (e.key === 'ArrowLeft') $('b-prev').click()
  })
  $('custom').addEventListener('submit', e => {
    e.preventDefault()
    const text = new FormData(e.target).get('text').trim()
    const lines = (text.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+["'”’)]*|[^.!?]+$/g) || [])
      .map(s => s.trim()).filter(s => /[a-z]/i.test(s)).slice(0, 40).map(s => [s, ''])
    if (!lines.length) { $('custom-msg').className = 'msg err'; $('custom-msg').textContent = '没找到英文句子'; return }
    custom = { title: '我的文本', lines }
    store.set('en-custom', custom)
    topic = 'custom'; idx = 0; store.set('en-topic', topic)
    $('custom-msg').className = 'msg'; $('custom-msg').textContent = `已拆成 ${lines.length} 句`
    renderTopics(); renderRead()
  })
  $('sr-note').textContent = SR
    ? '读完会按识别结果给每个词打勾或标红。语音识别由浏览器提供（Chrome 会把录音发到 Google 识别）。'
    : '这个浏览器不支持自动评分：仍可录音，然后用「回放录音」和原音对比。Chrome、Edge、Safari 支持评分。'

  // ================= 英语：生词（辅） =================
  const SEED = [
    ['pain point', '痛点', "What's the biggest pain point in your current quoting process?"],
    ['walk me through', '给我讲讲（流程）', 'Could you walk me through how a support ticket is handled today?'],
    ['stakeholder', '利益相关方 / 关键人', 'Who are the key stakeholders we should involve in the pilot?'],
    ['decision maker', '拍板人', 'Is the CFO the final decision maker on this budget?'],
    ['proof of concept', '概念验证', 'We can run a two-week proof of concept on your own documents.'],
    ['pilot', '试点', "Let's start with a pilot in one region before rolling it out."],
    ['roll out', '全面推广 / 上线', 'We plan to roll it out to all sales teams in Q3.'],
    ['adoption', '（员工）实际使用率', 'Adoption dropped after week two, so we added in-app tips.'],
    ['ROI', '投资回报', 'The ROI comes mainly from cutting manual data entry.'],
    ['business case', '立项理由', "I'll help you build the business case for your leadership."],
    ['success metrics', '成功指标', "Let's agree on the success metrics before we start."],
    ['baseline', '基线（改进前的水平）', "What's the baseline response time today?"],
    ['bottleneck', '瓶颈', 'Approval is the real bottleneck, not data collection.'],
    ['workflow', '工作流', 'We automate the workflow from inquiry to quote.'],
    ['knowledge base', '知识库', 'The assistant answers from your internal knowledge base.'],
    ['hallucination', '（模型）编造内容', 'We reduce hallucinations by limiting answers to retrieved sources.'],
    ['edge case', '边界情况', 'Large refunds are an edge case we route to a human.'],
    ['human in the loop', '人工把关环节', 'Keep a human in the loop for contract-related replies.'],
    ['integrate with', '与……集成', 'It integrates with your CRM through the open API.'],
    ['data silo', '数据孤岛', 'Sales and service data sit in separate silos.'],
    ['trade-off', '取舍', 'The trade-off is speed versus accuracy.'],
    ['scope creep', '需求范围蔓延', "Let's lock the scope to avoid scope creep."],
    ['deliverable', '交付物', 'The first deliverable is a working demo on your data.'],
    ['follow up', '跟进', "I'll follow up with a summary and next steps by Friday."],
    ['circle back', '回头再议', 'Let me check with our engineers and circle back tomorrow.'],
    ['on the same page', '理解一致', "Just to make sure we're on the same page about the budget."],
    ['objection', '（客户）异议', 'The most common objection is data security.'],
    ['quick win', '速赢', 'A quick win in month one builds trust for the bigger project.'],
    ['champion', '客户内部的推动者', 'We need a champion inside the operations team.'],
    ['procurement', '采购流程', 'How long does procurement usually take on your side?'],
  ]
  const INTERVALS = [0, 1, 2, 4, 7, 15, 30, 60]
  const NEW_PER_DAY = 5
  let deck = store.get('en-deck', null)
  if (!deck) deck = { cards: SEED.map(([f, b, e], i) => ({ id: `s${i}`, front: f, back: b, example: e, box: 0, due: null })), log: {} }
  let vRevealed = false
  const saveDeck = () => store.set('en-deck', deck)
  function vQueue() {
    const t = dayKey()
    const due = deck.cards.filter(c => c.box > 0 && c.due && c.due <= t).sort((a, b) => a.due.localeCompare(b.due))
    const room = Math.max(0, NEW_PER_DAY - (deck.log[t]?.new || 0))
    const retry = due.filter(c => c.last === t)
    return [...due.filter(c => c.last !== t), ...deck.cards.filter(c => c.box === 0).slice(0, room), ...retry]
  }
  function vGrade(card, g) {
    const t = dayKey(), log = (deck.log[t] ||= { reviews: 0, new: 0 })
    if (card.box === 0) log.new++
    log.reviews++
    if (g === 'again') { card.box = 1; card.due = t } else { card.box = Math.min(INTERVALS.length - 1, card.box + 1); card.due = addDays(t, INTERVALS[card.box]) }
    card.last = t
    vRevealed = false
    saveDeck(); renderVocab()
  }
  function renderVocab() {
    const q = vQueue(), c = q[0]
    $('vocab-count').textContent = `今日还剩 ${q.length} · 词库 ${deck.cards.length}`
    if (!c) { $('vocab').replaceChildren(el('div', { class: 'vocab' }, el('div', { class: 'empty' }, '今天的生词复习完成了'))); renderDeck(); return }
    $('vocab').replaceChildren(el('div', { class: 'vocab' },
      el('div', {}, el('div', { class: 'vf serif' }, c.front),
        vRevealed ? el('div', { class: 'vb' }, c.back) : null,
        vRevealed && c.example ? el('div', { class: 've serif' }, c.example) : null),
      el('div', { class: 'va' },
        el('button', { class: 'btn', type: 'button', title: '朗读', onclick: () => speak(vRevealed && c.example ? c.example : c.front) }, '▶'),
        ...(vRevealed
          ? [el('button', { class: 'btn again', type: 'button', onclick: () => vGrade(c, 'again') }, '忘了'),
             el('button', { class: 'btn good', type: 'button', onclick: () => vGrade(c, 'good') }, '记得')]
          : [el('button', { class: 'btn', type: 'button', onclick: () => { vRevealed = true; renderVocab(); speak(c.front) } }, '看释义')]))))
    renderDeck()
  }
  function renderDeck() {
    $('deck-list').replaceChildren(...deck.cards.slice().reverse().map(c => el('div', { class: 'deck-item' },
      el('div', { class: 'f' }, c.front, el('span', {}, c.back)),
      el('span', { class: 'b' }, c.box === 0 ? '新' : c.box >= 5 ? '已掌握' : `第 ${c.box} 轮`),
      el('button', { type: 'button', title: '删除', onclick: () => { if (confirm(`删除「${c.front}」？`)) { deck.cards = deck.cards.filter(x => x !== c); saveDeck(); renderVocab() } } }, '删除'))))
  }
  $('add').addEventListener('submit', e => {
    e.preventDefault()
    const f = new FormData(e.target), front = f.get('front').trim(), back = f.get('back').trim()
    if (deck.cards.some(c => c.front.toLowerCase() === front.toLowerCase())) { $('add-msg').className = 'msg err'; $('add-msg').textContent = '词库里已经有了'; return }
    deck.cards.unshift({ id: `u${Date.now()}`, front, back, example: f.get('example').trim(), box: 0, due: null })
    saveDeck(); e.target.reset(); $('add-msg').className = 'msg'; $('add-msg').textContent = `已添加「${front}」`
    renderVocab()
  })

  // ================= 启动 =================
  syncToggles(); renderTopics(); idx = firstUndone(); renderRead(); renderChips(); renderVocab()
  loadUsage()
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadUsage() })
})()
</script>
</body>
</html>
